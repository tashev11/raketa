name: Catalog smoke test

on:
  push:
    branches:
      - catalog-scale
  pull_request:
    paths:
      - 'catalog-*.js'
      - 'support.js'
      - '.github/workflows/catalog-smoke.yml'

permissions:
  contents: read

jobs:
  catalog-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check support.js
          node --check catalog-runtime.js
          node --check catalog-virtual.js
          node --check catalog-policy.js
          node --check catalog-smoke-test.js
      - name: Catalog smoke test
        run: node catalog-smoke-test.js
